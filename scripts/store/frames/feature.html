<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@500;600&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{background:radial-gradient(120% 140% at 85% 50%,#16351F 0%,#0B1F13 60%);font-family:Inter,sans-serif;color:#F3F1E3;position:relative}
.wrap{position:absolute;inset:0;display:flex;align-items:center;padding:0 64px;gap:56px}
.txt{flex:1}
.eyebrow{font:600 18px Inter;letter-spacing:.18em;text-transform:uppercase;color:#4FB477;margin-bottom:18px}
h1{font:800 50px/1.06 Archivo;margin:0 0 20px;letter-spacing:-.01em}
h1 b{color:#4FB477;font-weight:800}
p{font:500 22px/1.4 Inter;color:#9FB1A4;margin:0;max-width:540px}
img{width:280px;height:280px;filter:drop-shadow(0 10px 40px rgba(0,0,0,.45))}
.line{position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#1D6B3F,#4FB477)}
</style></head><body>
<div class="wrap"><div class="txt">
<div class="eyebrow">Voice-first AI caddie</div>
<h1>Other golf apps give you numbers.<br><b>Your caddie makes<br>the call.</b></h1>
<p>Club, target and the miss to favor, spoken while you stand over the ball.</p>
</div><img src="badge.png" alt=""></div><div class="line"></div>
</body></html>
