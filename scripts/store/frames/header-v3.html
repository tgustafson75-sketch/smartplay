<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Inter:wght@500;600&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1920px;height:823px;overflow:hidden}
body{background:radial-gradient(70% 120% at 72% 50%,#16351F 0%,#0B1F13 65%);font-family:Inter,sans-serif;color:#F3F1E3;position:relative}
.copy{position:absolute;left:230px;top:50%;transform:translateY(-50%);width:760px}

.vet{margin-top:28px;display:inline-flex;align-items:center;gap:10px;font:600 16px Inter;letter-spacing:.14em;text-transform:uppercase;color:#F3F1E3;border:2px solid #1E4429;border-radius:100px;padding:8px 16px 8px 12px}
