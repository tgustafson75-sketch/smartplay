<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Inter:wght@500;600&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1920px;height:823px;overflow:hidden;background:#0B1F13}
body{position:relative;font-family:Inter,sans-serif;color:#F3F1E3}
.photo{position:absolute;left:180px;top:0;width:820px;height:823px;background:url(../../../assets/avatars/kevin_portrait.jpg) 50% 22%/cover no-repeat}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,31,19,.85) 0%,rgba(11,31,19,0) 22%,rgba(11,31,19,0) 52%,rgba(11,31,19,.92) 88%,#0B1F13 100%),linear-gradient(0deg,rgba(11,31,19,.55),rgba(11,31,19,0) 30%)}
.edge{position:absolute;inset:0;background:linear-gradient(90deg,#0B1F13 0 180px,transparent 420px)}
.copy{position:absolute;left:930px;top:50%;transform:translateY(-50%);width:820px}
.eyebrow{font:600 22px Inter;letter-spacing:.2em;text-transform:uppercase;color:#4FB477;margin-bottom:22px}
h1{font:800 100px/1 Archivo;margin:0;letter-spacing:-.015em}
h1 b{color:#4FB477;font-weight:800}
.call{margin-top:36px;display:flex;gap:18px;align-items:flex-start;background:rgba(16,42,26,.85);border:2px solid #1E4429;border-radius:22px;padding:22px 26px;width:700px}
.call .who{font:600 18px Inter;letter-spacing:.14em;text-transform:uppercase;color:#4FB477;margin-bottom:6px}
.call p{margin:0;font:500 30px/1.3 Inter;color:#F3F1E3}
.spk{width:34px;height:34px;flex:none;margin-top:30px;color:#4FB477}
.vet{margin-top:28px;display:inline-flex;align-items:center;gap:10px;font:600 17px Inter;letter-spacing:.14em;text-transform:uppercase;color:#F3F1E3;border:2px solid #1E4429;border-radius:100px;padding:9px 18px 9px 14px}
.vet svg{color:#C9A227}
</style></head><body>
<div class="photo"></div><div class="edge"></div>
<div class="copy">
  <div class="eyebrow">Voice-first AI caddie</div>
  <h1>Your intelligent<br><b>golf partner.</b></h1>
  <div class="call"><svg class="spk" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <div><div class="who">Kevin</div><p>165, plays 168. Seven-iron, center of the green. Short is fine.</p></div></div>
  <div class="vet"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2.8l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 16.8l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="currentColor"/></svg>Veteran owned and developed</div>
</div>
</body></html>
