plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.smartplaycaddie.wear'
    /**
     * 2026-09-21 — 34 -> 35. Play REFUSES a Wear OS bundle below targetSdk 35 (rejected on
     * versionCode 1029). compileSdk must be at least targetSdk, so both move together.
     */
    compileSdk 35

    defaultConfig {
        // MUST match the phone app's applicationId for the Wearable Data
        // Layer to auto-associate the two apps. Do not change.
        applicationId 'com.smartplaycaddie.app'
        // Wear OS 3 = API 30. minSdk 30 covers the Galaxy Watch 4+.
        minSdk 30
        /**
         * 33 -> 35, forced by Play's Wear OS upload requirement.
         *
         * NOT a free bump — targetSdk 34 makes a foreground service ILLEGAL without a declared
         * type, and this app runs one for IMU capture. Checked before changing it rather than
         * after: AndroidManifest already declares
         *   <service android:foregroundServiceType="dataSync" />
         * plus the matching FOREGROUND_SERVICE_DATA_SYNC permission, so the API 34 requirement was
         * already satisfied. Also verified there are no runtime-registered BroadcastReceivers (API
         * 34 would require RECEIVER_EXPORTED/RECEIVER_NOT_EXPORTED) and no PendingIntents needing
         * an explicit mutability flag. startForeground() takes its type from the manifest.
         *
         * Android 15 caps a `dataSync` foreground service at 6h per 24h. A swing-capture session is
         * minutes, so the cap is not reachable here.
         */
        targetSdk 35
        // 2026-09-21 — versionCode had never moved off 1 while the source changed for six weeks,
        // and the APK on disk predated both ends of the watch command path it was supposed to
        // carry. Play requires a UNIQUE versionCode across every artifact in one app listing, and
        // this app shares applicationId com.smartplaycaddie.app with the phone (it must, or the
        // Data Layer will not pair) — so 1 collides the moment both are in the same release.
        //
        // The 1000 offset keeps the two sequences from ever meeting and stays readable: 1028 is
        // "the watch APK that goes with phone build 28". Bump it with the phone build it ships
        // alongside.
        versionCode 1030
        versionName '1.0.1'
    }

    // ── Signing ───────────────────────────────────────────────────────────────
    // THE PAIRING GOTCHA (see README): the Wearable Data Layer only delivers
    // messages between two apps that share the same applicationId AND are signed
    // with the SAME key. The phone app is signed with the EAS-managed Android
    // keystore, so a real yardage/mic tie-in test needs THIS app signed with that
    // same keystore.
    //
    //   1. Export it from the phone project:  eas credentials -p android
    //      (Keystore → "Download existing keystore") — you get an .jks + the store
    //      password, key alias, and key password.
    //   2. Drop those into wear-os-app/keystore.properties (gitignored):
    //        storeFile=/absolute/path/to/eas.jks
    //        storePassword=...
    //        keyAlias=...
    //        keyPassword=...
    //   3. Build the paired APK:  ./gradlew :app:assembleRelease
    //
    // Without that file, `assembleRelease` falls back to the debug keystore so the
    // build still succeeds — but it will NOT pair with the EAS-signed phone app.
    // `assembleDebug` always works (auto debug keystore); use it only to verify the
    // UI/toolchain, not the Data Layer tie-in.
    signingConfigs {
        release {
            def kpf = rootProject.file('keystore.properties')
            if (kpf.exists()) {
                def kp = new Properties()
                kpf.withInputStream { kp.load(it) }
                storeFile file(kp['storeFile'])
                storePassword kp['storePassword']
                keyAlias kp['keyAlias']
                keyPassword kp['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use the EAS keystore when keystore.properties is present; otherwise
            // fall back to the debug keystore so the build never hard-fails.
            signingConfig rootProject.file('keystore.properties').exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    // Wearable Data Layer (MessageClient / NodeClient). Google Maven —
    // no GitHub token / private repo needed.
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
